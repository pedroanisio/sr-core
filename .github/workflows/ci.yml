name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the tags: tests of SREPs 76 to 83 read the schema-1.5.0 files they amend
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: test dependencies (the package itself needs none)
        run: python -m pip install pytest setuptools wheel lxml numpy pillow
      - name: tests (vpkg, schema rules, reference, conformance runner, release tooling, hygiene, how-to)
        run: python -m pytest -q tests
        env:
          SR_SCENE_CORPUS: "1"    # the scene SDK's corpus and lxml differentials (D5, D6), skipped by default
      - name: versions, schema hashes and generated reference agree
        run: python tools/release.py check
      - name: release hygiene, including the sdist and wheel
        run: python tools/check_hygiene.py --artifacts
      - name: the installed commands work outside the checkout
        shell: bash
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          scenerender-vpkg --version
          sr-schemadoc --version
          sr-review --version
          sr-scene --version
          sr-schemadoc --xsd "$GITHUB_WORKSPACE/schema/scene-render.xsd" -o site
          test -f site/index.html
